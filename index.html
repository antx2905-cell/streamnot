<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>StreamNot</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:transparent;overflow:hidden}
#m{display:none;position:fixed;left:12px;bottom:12px;font:600 13px system-ui,sans-serif;color:#fff;background:rgba(12,12,16,.85);padding:8px 12px;border-radius:10px}</style>
</head><body><div id="m"></div>
<script>
/* StreamNot · página puente para TikTok LIVE Studio
   Uso: https://.../streamnot/#perfil/overlay   (opcional @puerto, ej. #yo/alerts@8788;
   y un modo: #yo/lives/sinvidas)
   LIVE Studio solo acepta enlaces públicos. Esta página es pública y,
   ya dentro de LIVE Studio, abre el overlay que StreamNot sirve en tu PC. */
(function () {
  var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
  var port = 8787, m = h.match(/@(\d+)$/);
  if (m) { port = +m[1]; h = h.replace(/@\d+$/, ''); }
  var parts = h.split('/').filter(Boolean);
  // opcional: 3a parte = modo dentro del overlay (ej. #yo/lives/sinvidas)
  if ((parts.length !== 2 && parts.length !== 3) || !parts.every(function (x) { return /^[\w-]+$/.test(x); })) {
    var el = document.getElementById('m'); el.textContent = 'StreamNot: copia el enlace desde la app.'; el.style.display = 'block'; return;
  }
  var base = 'http://127.0.0.1:' + port;
  var target = base + '/o/' + parts[0] + '/' + parts[1] + (parts[2] ? '#' + parts[2] : '');
  var tries = 0;
  function probe() {
    var img = new Image();
    img.onload = function () { location.replace(target); };
    img.onerror = function () {
      tries++;
      if (tries === 4) { var el = document.getElementById('m'); el.textContent = 'Abre StreamNot en tu PC…'; el.style.display = 'block'; }
      setTimeout(probe, 3000);
    };
    img.src = base + '/logo.svg?t=' + Date.now();
  }
  probe();
})();
</script></body></html>
